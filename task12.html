<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="desc" placeholder="Description">
<input id="amount" type="number" placeholder="Amount">
<select id="category">
  <option>Food</option><option>Transport</option><option>Others</option>
</select>
<button id="addExp">Add Expense</button>
<ul id="expenses"></ul>
<div id="summary"></div>

<script>
let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

function renderExpenses() {
  const ul = document.getElementById('expenses');
  ul.innerHTML = '';
  const summary = {};
  expenses.forEach((e,i)=>{
    const li = document.createElement('li');
    li.textContent = `${e.desc} - $${e.amount} (${e.category})`;
    li.onclick = () => { expenses.splice(i,1); save(); renderExpenses(); };
    ul.appendChild(li);
    summary[e.category] = (summary[e.category]||0) + Number(e.amount);
  });
  document.getElementById('summary').innerHTML = JSON.stringify(summary);
}

function save() { localStorage.setItem('expenses', JSON.stringify(expenses)); }

document.getElementById('addExp').onclick = () => {
  const desc = document.getElementById('desc').value;
  const amount = document.getElementById('amount').value;
  const category = document.getElementById('category').value;
  if(desc && amount) { expenses.push({desc, amount, category}); save(); renderExpenses(); }
};

renderExpenses();
</script>
</body>
</html>
