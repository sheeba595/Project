<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Shopping Cart</h2>

        <div class="products">
            <div class="product">
                <span class="name">Product A</span>
                <span class="price" data-price="100">₹100</span>
                <button class="add-btn">Add to Cart</button>
            </div>
            <div class="product">
                <span class="name">Product B</span>
                <span class="price" data-price="200">₹200</span>
                <button class="add-btn">Add to Cart</button>
            </div>
            <div class="product">
                <span class="name">Product C</span>
                <span class="price" data-price="150">₹150</span>
                <button class="add-btn">Add to Cart</button>
            </div>
        </div>

        <h3>Your Cart</h3>
        <table id="cartTable">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Remove</th>
                </tr>
            </thead>
            <tbody>
                <!-- Cart items will appear here -->
            </tbody>
        </table>

        <h3 id="grandTotal">Grand Total: ₹0</h3>
    </div>

    <script src="script.js"></script>
</body>
</html>
