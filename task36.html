<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input placeholder="Item" id="item">
<input type="number" placeholder="Price" id="price">
<button id="add">Add</button>
<ul id="list"></ul>
<div id="total"></div>

<script>
let items=[];
function render(){
  const ul = document.getElementById('list'); ul.innerHTML='';
  let sum=0;
  items.forEach(it=>{
    ul.innerHTML += `<li>${it.name} - $${it.price}</li>`;
    sum+=Number(it.price);
  });
  const tax = sum*0.1;
  document.getElementById('total').textContent = `Total: $${sum} | Tax: $${tax} | Grand Total: $${sum+tax}`;
}
document.getElementById('add').onclick = ()=>{
  const name = document.getElementById('item').value;
  const price = document.getElementById('price').value;
  if(name && price){ items.push({name, price}); render(); }
};
</script>
</body>
</html>
