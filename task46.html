<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="board"></ul>

<script>
const users=[{name:'Alice',score:10},{name:'Bob',score:15},{name:'Charlie',score:12}];
function render(){
  const ul=document.getElementById('board'); ul.innerHTML='';
  users.sort((a,b)=>b.score-a.score).forEach(u=>{ const li=document.createElement('li'); li.textContent=`${u.name}: ${u.score}`; ul.appendChild(li); });
}
render();
</script>
</body>
</html>
