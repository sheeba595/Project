<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="carousel" style="width:300px;height:200px;overflow:hidden;position:relative;">
  <img src="https://via.placeholder.com/300x200/ff0000" class="slide">
  <img src="https://via.placeholder.com/300x200/00ff00" class="slide">
  <img src="https://via.placeholder.com/300x200/0000ff" class="slide">
</div>
<button id="prev">Prev</button>
<button id="next">Next</button>

<script>
const slides = document.querySelectorAll('.slide');
let index=0;
slides.forEach((s,i)=>{s.style.position='absolute'; s.style.top=0; s.style.left=0; s.style.display=i===0?'block':'none';});

function show(i){ slides.forEach((s,j)=> s.style.display = j===i?'block':'none'); }
document.getElementById('next').onclick = ()=>{ index=(index+1)%slides.length; show(index); };
document.getElementById('prev').onclick = ()=>{ index=(index-1+slides.length)%slides.length; show(index); };
setInterval(()=>{ index=(index+1)%slides.length; show(index); },3000);
</script>
</body>
</html>
