<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <select id="product"><option value="100">Phone $100</option><option value="200">Laptop $200</option></select>
<input type="number" id="qty" value="1">
<div id="total"></div>

<script>
function calc(){ const price=Number(document.getElementById('product').value); const qty=Number(document.getElementById('qty').value); document.getElementById('total').textContent='Total: $'+(price*qty); }
document.getElementById('product').onchange=calc;
document.getElementById('qty').oninput=calc;
calc();
</script>
</body>
</html>
