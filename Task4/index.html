<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sortable Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Sortable Table</h2>
        <table id="sortableTable">
            <thead>
                <tr>
                    <th data-type="string">Name</th>
                    <th data-type="number">Age</th>
                    <th data-type="string">Country</th>
                    <th data-type="number">Score</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>Alice</td><td>25</td><td>India</td><td>88</td></tr>
                <tr><td>Bob</td><td>22</td><td>USA</td><td>95</td></tr>
                <tr><td>Charlie</td><td>30</td><td>UK</td><td>72</td></tr>
                <tr><td>Diana</td><td>28</td><td>Canada</td><td>80</td></tr>
                <tr><td>Eva</td><td>24</td><td>Australia</td><td>90</td></tr>
            </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
