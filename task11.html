<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="noteInput" placeholder="Write a note">
<button id="addNote">Add Note</button>
<input id="search" placeholder="Search notes">
<ul id="notes"></ul>

<script>
const noteInput = document.getElementById('noteInput');
const addNote = document.getElementById('addNote');
const notesUL = document.getElementById('notes');
const search = document.getElementById('search');

let notes = JSON.parse(localStorage.getItem('notes')) || [];

function renderNotes(filter='') {
  notesUL.innerHTML = '';
  notes.filter(n => n.includes(filter)).forEach((note, i) => {
    const li = document.createElement('li');
    li.textContent = note;
    li.onclick = () => { notes.splice(i,1); saveNotes(); renderNotes(search.value); };
    notesUL.appendChild(li);
  });
}

function saveNotes() { localStorage.setItem('notes', JSON.stringify(notes)); }

addNote.onclick = () => {
  if(noteInput.value.trim()) notes.push(noteInput.value.trim());
  noteInput.value='';
  saveNotes();
  renderNotes(search.value);
};

search.oninput = () => renderNotes(search.value);

renderNotes();
</script>
</body>
</html>
