<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
  .skill { margin:20px; background:#eee; height:30px; width:80%; }
  .bar { height:100%; width:0%; background:green; color:white; text-align:center; }
</style>

<body>
    <div style="height:500px;"></div>
<div class="skill"><div class="bar" data-width="80">0%</div></div>
<div class="skill"><div class="bar" data-width="60">0%</div></div>


<script>
function animateBar(el){
  let width=0;
  const target = el.dataset.width;
  const id = setInterval(()=>{ if(width>=target) clearInterval(id); else {width++; el.style.width=width+'%'; el.textContent=width+'%';} },10);
}

window.onscroll = ()=>{
  document.querySelectorAll('.bar').forEach(bar=>{
    const rect = bar.getBoundingClientRect();
    if(rect.top<window.innerHeight) animateBar(bar);
  });
};
</script>
</body>
</html>
